name: Vigilar Stock El Corte Ingles

on:
  workflow_dispatch:

concurrency:
  group: rastreador-eci-unico
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  comprobar-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright y Chromium
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: Ejecutar rastreador
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -u rastreador_ditto.py

      - name: Lanzar siguiente ronda automaticamente
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run vigilar.yml
